name: elaintehtaat

services:
  varnish:
    image: varnish:7
    ports:
      - "8080:80"
    volumes:
      - ./docker/varnish/default.vcl:/etc/varnish/default.vcl:ro
    # Drupal's Cache-Tags response header can exceed Varnish's 8k default
    # header limit on tag-heavy pages, which surfaces as a 503 from Varnish.
    command:
      - -p
      - http_resp_hdr_len=65536
      - -p
      - http_resp_size=98304
      - -p
      - http_req_hdr_len=32768
      - -p
      - workspace_backend=196608
    environment:
      VARNISH_SIZE: ${VARNISH_SIZE:-256M}
    depends_on:
      - nginx

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8081:80"   # bypasses Varnish, handy for debugging
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: ./docker/php
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-drupal.ini:ro
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-drupal}
      MYSQL_USER: ${MYSQL_USER:-drupal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-drupal}
      REDIS_HOST: redis
      S3_ENDPOINT: rustfs:9000
      S3_PUBLIC_HOST: ${S3_PUBLIC_HOST:-localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-drupal-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:-change-me-in-dot-env}
      # Lets drush (uli, etc.) generate links with the real host instead of http://default.
      DRUSH_OPTIONS_URI: ${DRUPAL_BASE_URL:-http://localhost:8080}
      COMPOSER_HOME: /tmp/composer
      # PHPUnit functional tests hit nginx directly.
      SIMPLETEST_DB: mysql://${MYSQL_USER:-drupal}:${MYSQL_PASSWORD:-drupal}@mysql/${MYSQL_DATABASE:-drupal}
      SIMPLETEST_BASE_URL: http://nginx
      BROWSERTEST_OUTPUT_DIRECTORY: /var/www/html/web/sites/simpletest/browser_output
      BROWSERTEST_OUTPUT_BASE_URL: http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully

  mysql:
    image: mariadb:12.3
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --transaction-isolation=READ-COMMITTED
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-drupal}
      MARIADB_USER: ${MYSQL_USER:-drupal}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-drupal}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/drupal.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"

  # S3-compatible object storage for Drupal files (API on 9000, console on 9001).
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the bucket and make it publicly readable, then exit.
  rustfs-init:
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-drupal-files}
    volumes:
      - ./docker/rustfs/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  mysql-data:
  rustfs-data:
