      -
        value: '<p>Noin 1 500 eläimen kettutarha Keski-Pohjanmaalla, kuvattu yöllä avoimien varjotalojen ulkopuolelta. Ketut elävät pienissä verkkopohjaisissa häkeissä riveissä katon alla ilman kiinteää lattiaa tai kuivikkeita. Useat eläimet kulkivat häkissään edestakaisin tai kiertivät ympyrää, ja joillakin näkyi vääntyneitä tai vahingoittuneita jalkoja. Sarja dokumentoi varjotalorivit, häkkiolosuhteet ja yksittäisiä eläimiä.</p>'
