  field_description:
    -
      value: '<p>A fox farm of roughly 1,500 animals in Central Ostrobothnia, photographed at night from outside the open-sided sheds. The foxes are kept in rows of small wire-mesh cages under a roof, with no solid floor or bedding. Several animals paced or circled repeatedly in their cages, and bent or injured feet were visible on some. The set documents the shed rows, cage conditions and individual animals.</p>'
