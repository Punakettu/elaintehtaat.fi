    field_description:
      -
        value: '<p>Eläintehtaat 2024 on arkiston ensimmäinen dokumentointiprojekti. Kevään ja syksyn 2024 välillä riippumattomat kuvaajat vierailivat sikaloissa, broilerihalleissa ja turkistarhoilla eri puolilla Etelä- ja Länsi-Suomea ja tallensivat tavallisten, luvallisten tuotantotilojen arkea: eläintiheyttä, lattiarakenteita, virikkeitä ja eläinten kuntoa. Aineisto julkaistaan albumi kerrallaan, jotta toimittajat, tutkijat ja kansalaiset voivat nähdä, miltä suomalaisen eläintuotannon luvut näyttävät käytännössä.</p>'
        format: basic_html
