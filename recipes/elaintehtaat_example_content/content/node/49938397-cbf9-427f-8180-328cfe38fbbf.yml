  field_description:
    -
      value: '<p>Eläintehtaat 2024 is the archive’s first documentation project. Between spring and autumn 2024, independent photographers visited pig, broiler and fur farms across southern and western Finland and recorded everyday conditions on ordinary, permitted production sites: stocking density, flooring, enrichment and the state of the animals. The material is published album by album so that journalists, researchers and the public can see what the figures behind Finnish animal production look like in practice.</p>'
      format: basic_html
