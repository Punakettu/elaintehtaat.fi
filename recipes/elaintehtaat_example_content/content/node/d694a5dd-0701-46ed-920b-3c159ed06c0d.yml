      -
        value: '<p>Noin 2 200 lihasian tila Kanta-Hämeessä. Kuvat on otettu kasvatuksen loppuvaiheessa, kun eläimet ovat lähellä teuraspainoa. Karsinat ovat ritilälattiaisia ja kuivittamattomia; virikkeenä oli paikoin lyhyt ketju. Useilla eläimillä näkyi hännänpurentaa ja ihovaurioita. Sarja dokumentoi tilan yleisilmettä, karsinaolosuhteita ja yksittäisten eläinten kuntoa.</p>'
