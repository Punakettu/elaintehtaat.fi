  field_description:
    -
      value: '<p>A facility holding roughly 2,200 meat pigs in Kanta-Häme. Photographs were taken in the late fattening stage, with animals close to slaughter weight. Pens are slatted and bare of bedding; enrichment in places amounted to a short chain. Tail-biting and skin lesions were visible on several animals. The set documents the overall site, pen conditions, and the condition of individual animals.</p>'
      format: basic_html
