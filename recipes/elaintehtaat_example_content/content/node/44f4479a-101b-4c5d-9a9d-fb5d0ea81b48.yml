  field_body:
    -
      value: |-
        <p>Eläintehtaat is an open image and video archive documenting the conditions of animals in Finnish food and fur production. The material is collected by independent photographers and volunteers and published so that journalists, researchers and the public can see for themselves how animals are kept.</p>
        <h2>How the material may be used</h2>
        <p>Each album carries a licence. Most material is released under Creative Commons licences that allow non-commercial use with attribution. Some material is restricted to editorial use. Always check the licence of the album you are using and credit the archive as instructed.</p>
        <h2>Contact the editorial team</h2>
        <p>Questions about the material, requests for high-resolution files and tips about sites worth documenting can be sent to <a href="mailto:arkisto@elaintehtaat.fi">arkisto@elaintehtaat.fi</a>.</p>
      format: basic_html
