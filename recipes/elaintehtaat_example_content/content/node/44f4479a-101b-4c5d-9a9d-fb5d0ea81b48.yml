    field_body:
      -
        value: |-
          <p>Eläintehtaat on avoin kuva- ja videoarkisto, joka dokumentoi eläinten olosuhteita suomalaisessa ruoan- ja turkistuotannossa. Aineiston keräävät riippumattomat kuvaajat ja vapaaehtoiset, ja se julkaistaan, jotta toimittajat, tutkijat ja kansalaiset voivat itse nähdä, miten eläimiä pidetään.</p>
          <h2>Miten aineistoa saa käyttää</h2>
          <p>Jokaisella albumilla on lisenssi. Suurin osa aineistosta on julkaistu Creative Commons -lisensseillä, jotka sallivat ei-kaupallisen käytön lähde mainiten. Osa aineistosta on rajattu toimitukselliseen käyttöön. Tarkista aina käyttämäsi albumin lisenssi ja mainitse arkisto ohjeiden mukaisesti.</p>
          <h2>Ota yhteyttä toimitukseen</h2>
          <p>Kysymykset aineistosta, pyynnöt täysikokoisista tiedostoista ja vinkit dokumentoinnin arvoisista kohteista voi lähettää osoitteeseen <a href="mailto:arkisto@elaintehtaat.fi">arkisto@elaintehtaat.fi</a>.</p>
        format: basic_html
        summary: ''
