    title:
      -
        value: 'Tietoa meistä'
    components:
      -
        uuid: e3a5b3f2-1111-4111-8111-000000000001
        component_id: sdc.elaintehtaat.text
        inputs:
          text:
            value: '<p>Eläintehtaat on avoin kuva- ja videoarkisto, joka dokumentoi eläinten olosuhteita suomalaisessa ruoan- ja turkistuotannossa.</p>'
            format: canvas_html_block
          style: lede
          tone: muted
      -
        uuid: e3a5b3f2-1111-4111-8111-000000000002
        component_id: sdc.elaintehtaat.text
        inputs:
          text:
            value: '<p>Aineiston keräävät riippumattomat kuvaajat ja vapaaehtoiset, ja se julkaistaan, jotta toimittajat, tutkijat ja kansalaiset voivat itse nähdä, miten eläimiä pidetään.</p><p><strong>Aineiston käyttö.</strong> Jokaisella albumilla on lisenssi. Suurin osa aineistosta on käytettävissä ei-kaupallisesti lähde mainiten, osa on rajattu toimitukselliseen käyttöön. Tarkista aina käyttämäsi albumin lisenssi ja mainitse arkisto ohjeiden mukaisesti.</p><p><strong>Yhteydenotot.</strong> Kysymykset aineistosta, pyynnöt täysikokoisista tiedostoista ja vinkit dokumentoinnin arvoisista kohteista voi lähettää osoitteeseen <a href="mailto:arkisto@elaintehtaat.fi">arkisto@elaintehtaat.fi</a>.</p>'
            format: canvas_html_block
          style: body
          tone: default
