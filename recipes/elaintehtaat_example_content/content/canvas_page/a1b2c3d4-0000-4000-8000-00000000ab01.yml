  title:
    -
      value: 'About us'
  components:
    -
      uuid: e3a5b3f2-1111-4111-8111-000000000001
      component_id: sdc.elaintehtaat.text
      inputs:
        text:
          value: '<p>Eläintehtaat is an open image and video archive documenting the conditions of animals in Finnish food and fur production.</p>'
          format: canvas_html_block
        style: lede
        tone: muted
    -
      uuid: e3a5b3f2-1111-4111-8111-000000000002
      component_id: sdc.elaintehtaat.text
      inputs:
        text:
          value: '<p>The material is collected by independent photographers and volunteers and published so that journalists, researchers and the public can see for themselves how animals are kept.</p><p><strong>Using the material.</strong> Each album carries a licence. Most material may be used non-commercially with attribution; some is restricted to editorial use. Always check the licence of the album you are using and credit the archive as instructed.</p><p><strong>Contact.</strong> Questions about the material, requests for high-resolution files and tips about sites worth documenting can be sent to <a href="mailto:arkisto@elaintehtaat.fi">arkisto@elaintehtaat.fi</a>.</p>'
          format: canvas_html_block
        style: body
        tone: default
