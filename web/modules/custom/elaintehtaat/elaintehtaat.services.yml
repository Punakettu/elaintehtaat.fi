services:
  _defaults:
    autowire: true

  Drupal\elaintehtaat\Album\AlbumLookup: ~

  Drupal\elaintehtaat\PathProcessor\MediaPagePathProcessor:
    tags:
      - { name: path_processor_inbound, priority: 50 }
      - { name: path_processor_outbound, priority: 250 }

  # Replaces core's system.breadcrumb.default, which has priority 0.
  Drupal\elaintehtaat\Breadcrumb\PathBasedBreadcrumbBuilder:
    tags:
      - { name: breadcrumb_builder, priority: 10 }

  Drupal\elaintehtaat\Routing\CanvasPageTranslationRouteSubscriber:
    tags:
      - { name: event_subscriber }
