name: Eläintehtaat
type: theme
'base theme': false
libraries:
  - core/normalize
  - elaintehtaat_theme/fonts
  - elaintehtaat_theme/global
  - elaintehtaat_theme/base
  - elaintehtaat_theme/messages
regions:
