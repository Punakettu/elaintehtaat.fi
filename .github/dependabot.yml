version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "drupal/*"
      - dependency-name: "drush/drush"
    groups:
      # Core packages must move in lockstep, so update them in a single PR.
      drupal-core:
        patterns:
          - "drupal/core"
          - "drupal/core-*"
      drupal-contrib:
        patterns:
          - "drupal/*"
          - "drush/drush"
        update-types:
          - minor
          - patch
